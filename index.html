<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Visor</title>
<style>
  :root { --bg:#fff; --fg:#1c1f24; --mut:#6b7280; --line:#e5e7eb; --acc:#1f3a5f; --ok:#0a7a3d; --err:#b42318; --card:#f5f7fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e8eaee; --mut:#9aa3b2; --line:#262b34; --acc:#8fb4ff; --ok:#4ade80; --err:#ff8a80; --card:#171a21; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,sans-serif; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  main { max-width:640px; margin:0 auto; padding:12px 0 40px; }
  h1 { font-size:20px; margin:8px 0 12px; } h2 { font-size:20px; margin:8px 0; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); }
  button, .btn { background:var(--acc); color:var(--bg); border:0; border-radius:10px; padding:12px 16px; font-size:16px; cursor:pointer; display:inline-block; }
  button.ghost, .btn.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); }
  input, select, textarea { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font-size:16px; margin:4px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; } .row > * { flex:1; min-width:120px; }
  #msg { min-height:22px; margin:6px 0; } .ok { color:var(--ok); } .err { color:var(--err); }
  ul { list-style:none; padding:0; margin:8px 0; }
  li { display:grid; grid-template-columns:48px 1fr auto; gap:2px 8px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  li .d { color:var(--mut); font-size:13px; } li .a { font-weight:600; text-align:right; } li .c { grid-column:2; color:var(--mut); font-size:13px; } li .t { grid-column:3; text-align:right; font-size:13px; }
  .kv, .line { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); } .k { color:var(--mut); } .a { font-variant-numeric:tabular-nums; }
  .muted { color:var(--mut); font-size:14px; } video { width:100%; border-radius:10px; }
  #total { color:var(--mut); font-size:14px; margin:6px 0; }
  nav { display:flex; gap:6px; margin:4px 0 10px; } nav button { flex:1; background:transparent; color:var(--acc); border:1px solid var(--line); padding:9px 4px; } nav button.on { background:var(--acc); color:var(--bg); }
  .big { font-size:32px; font-weight:700; margin:10px 0 2px; font-variant-numeric:tabular-nums; }
  li.g { position:relative; grid-template-columns:1fr auto 44px; gap:0 8px; padding:12px 4px 16px; } li.g .p { color:var(--mut); font-size:13px; text-align:right; align-self:center; }
  li.g .bar { position:absolute; left:4px; bottom:6px; height:4px; border-radius:2px; background:var(--acc); opacity:.55; }
  .sub { display:flex; justify-content:space-between; margin-top:18px; padding:6px 0; font-weight:600; border-bottom:2px solid var(--line); }
  .tag { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px; background:var(--card); color:var(--mut); font-size:12px; } .tag.no { color:var(--err); }
  .ver { text-align:center; font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <h1>Visor</h1>
  <nav id="nav" hidden><button data-tab="summary">Resum</button><button data-tab="list">Detall</button><button data-tab="upload">Envia</button></nav>
  <div id="msg" role="status"></div>

  <section id="setup" hidden>
    <p>Configura la teva clau. L'escaneges una sola vegada i es guarda protegida amb la biometria del mòbil.</p>
    <textarea id="keytext" rows="3" placeholder="efam1:key:…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button id="scan" class="ghost">Escaneja el QR</button><button id="savekey">Protegeix la clau</button></div>
    <video id="video" hidden playsinline></video>
  </section>

  <section id="locked" hidden>
    <p>Bloquejat. Cal la biometria per accedir a la clau.</p>
    <div class="row"><button id="unlock">Desbloqueja</button><button id="forget" class="ghost">Oblida aquest dispositiu</button></div>
  </section>

  <section id="summary" hidden>
    <select id="smonth" aria-label="Mes"></select>
    <div id="stotal" class="big"></div>
    <div id="spend" class="muted"></div>
    <ul id="groups"></ul>
  </section>

  <section id="group" hidden>
    <button id="gback" class="ghost">← Tornar</button>
    <h2 id="gtitle"></h2><div id="gsum" class="muted"></div>
    <div id="gbody"></div>
  </section>

  <section id="list" hidden>
    <input id="q" type="search" placeholder="Cerca (comerç, categoria…)">
    <div class="row"><select id="month"></select><select id="cat"></select></div>
    <div id="total"></div>
    <ul id="rows"></ul>
    <div class="row">
      <label class="btn ghost">Obre un paquet<input id="filepkg" type="file" accept=".efam,application/octet-stream" hidden></label>
      <button id="toupload" class="ghost">Envia un fitxer</button><button id="lock" class="ghost">Bloqueja</button>
    </div>
    <p id="seqinfo" class="muted"></p>
  </section>

  <section id="detail" hidden><button id="back" class="ghost">← Tornar</button><div id="detailbody"></div></section>

  <section id="upload" hidden>
    <button id="upback" class="ghost">← Tornar</button>
    <h2>Envia un fitxer</h2>
    <p class="muted">Es xifra al mòbil abans de sortir. Després comparteix el fitxer xifrat des del full de compartir.</p>
    <div class="row">
      <label class="btn">Fes una foto<input id="takephoto" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn ghost">Tria un fitxer<input id="pickfile" type="file" hidden></label>
    </div>
    <div id="uploadres"></div>
  </section>
  <p id="ver" class="muted ver"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
